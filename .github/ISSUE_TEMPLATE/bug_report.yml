name: Bug report
description: Report a non-sensitive Cohex problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include conversations, credentials, task IDs, account quota values, complete `~/.codex` files, or confidential project names.
  - type: input
    id: controller-version
    attributes:
      label: Cohex version
      placeholder: 0.9.2 (build 2)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: MacBook Pro M3, macOS 15.5
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex Desktop version
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Controller connection
      options:
        - USB
        - Bluetooth
    validations:
      required: true
  - type: dropdown
    id: accessibility
    attributes:
      label: Accessibility status
      options:
        - Authorized
        - Not authorized
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal, redacted example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
